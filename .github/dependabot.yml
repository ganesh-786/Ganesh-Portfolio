# Weekly dependency updates.
#
# Security updates are separate. They are switched on in the repository settings and open their own
# pull requests as soon as an advisory is published, without waiting for the weekly run or the
# cooldown below.
#
# Every pull request opened here has to pass the same checks as any other change, and nothing is
# merged automatically. Routine updates are grouped, so a normal week is one pull request per
# ecosystem.
#
# Major versions are ignored on purpose. They are breaking by definition, and every open pull
# request counts against the limit, so a few unmerged majors would silence the routine weekly one.
# A major upgrade is planned and tested as a change of its own.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kathmandu
    open-pull-requests-limit: 3
    # Wait a week after a release before proposing it, so a bad release has time to be pulled.
    cooldown:
      default-days: 7
    assignees:
      - ganesh-786
    commit-message:
      prefix: deps
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Kathmandu
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    assignees:
      - ganesh-786
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - '*'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
